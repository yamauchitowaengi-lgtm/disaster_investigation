<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="災害調査">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>ポール横断 Pro v2.2</title>
<link rel="stylesheet" href="app.css">
<style>
  :root{--c:#0f766e;--c-soft:rgba(15,118,110,.08);--c-ring:rgba(15,118,110,.28)}
  .dir{display:flex;gap:8px}
  .dir button{flex:1;min-height:52px;border-radius:12px;font-weight:800;font-size:16px;color:#fff;opacity:.4;transition:opacity .15s}
  .dir button.on{opacity:1;box-shadow:0 3px 10px rgba(0,0,0,.2)}
  #dirL{background:#3b82f6}#dirR{background:#10b981}
  .row3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px}
  .plot{width:100%;height:240px;display:block;background:#fff;border:1px solid var(--line);border-radius:10px}
  .plist{max-height:200px;overflow:auto;font-size:12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .plist div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #e2e8f0;font-family:ui-monospace,Menlo,monospace}
  .plist .cen{color:#dc2626;font-weight:800}
  .cnt{padding:2px 10px;border-radius:10px;background:#eef2f7;font-size:12px;font-weight:700;color:var(--mute)}
</style>
</head>
<body>
<header class="appbar">
  <a class="ib" href="index.html" aria-label="メニューへ戻る">‹</a>
  <div class="appbar-title">📏 ポール横断 <small style="opacity:.8">v2.2</small></div>
</header>

<main class="wrap narrow" style="display:grid;gap:12px">
  <div class="card">
    <div class="field"><label>STATION NAME</label>
      <input class="inp strong" id="station" value="No_0" style="font-size:18px">
    </div>
  </div>

  <div class="card" style="position:relative;padding:8px">
    <canvas id="plot" class="plot"></canvas>
    <span style="position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:10px;background:#ef4444;color:#fff;padding:1px 8px;border-radius:10px;font-weight:800">CENTER</span>
  </div>

  <div class="card" style="display:grid;gap:12px">
    <div class="dir">
      <button id="dirL" class="on">← 左を入力</button>
      <button id="dirR">右を入力 →</button>
    </div>
    <div class="row3">
      <select id="mode" class="inp"><option value="L">水平/垂直</option><option value="S">斜距/勾配</option></select>
      <input id="val1" class="inp mono" type="number" step="0.001" inputmode="decimal" placeholder="距離">
      <input id="val2" class="inp mono" type="number" step="0.001" inputmode="decimal" placeholder="高低 / n(1:n)">
    </div>
    <button class="btn pri" id="add" style="min-height:54px;font-size:17px">点を追加</button>
    <p class="hint" id="modeHint">水平距離と高低差(上り＋/下り−)を入力</p>
  </div>

  <div class="card" style="display:grid;gap:10px">
    <div class="card-h" style="margin:0"><h3>データリスト</h3><span class="cnt" id="cnt">0 pts</span></div>
    <div class="plist" id="list"></div>
    <div class="btnrow">
      <button class="btn" id="undo">↩︎ 直前の点を削除</button>
      <button class="btn danger" id="reset">リセット</button>
      <button class="btn pri" id="dxf">DXF保存・共有</button>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
(() => {
  'use strict';
  let dir = -1, left = [], right = [];
  const KEY = 'pole_v22';
  try { const s = JSON.parse(lsGet(KEY, 'null')); if (s) { left = s.left || []; right = s.right || []; $('#station').value = s.station || 'No_0'; } } catch (e) {}
  const save = () => lsSet(KEY, JSON.stringify({ left, right, station: $('#station').value }));

  function setDir(d) { dir = d; $('#dirL').classList.toggle('on', d === -1); $('#dirR').classList.toggle('on', d === 1); }
  $('#dirL').onclick = () => setDir(-1); $('#dirR').onclick = () => setDir(1);
  $('#station').addEventListener('input', save);
  $('#mode').addEventListener('change', () => {
    $('#modeHint').textContent = $('#mode').value === 'L' ? '水平距離と高低差(上り＋/下り−)を入力' : '斜距離と勾配 n（1:n）を入力';
  });

  function addPoint() {
    const mode = $('#mode').value, v1 = parseFloat($('#val1').value), v2 = parseFloat($('#val2').value);
    if (isNaN(v1) || isNaN(v2)) { toast('距離と高低(または勾配)を入力してください'); return; }
    const arr = dir === 1 ? right : left, last = arr.length ? arr[arr.length - 1] : { x: 0, y: 0 };
    let dx, dy;
    if (mode === 'L') { dx = v1 * dir; dy = v2; }
    else { const th = Math.atan(1 / v2); dx = v1 * Math.cos(th) * dir; dy = v1 * Math.sin(th); }
    arr.push({ x: last.x + dx, y: last.y + dy });
    $('#val1').value = ''; $('#val1').focus();
    save(); update();
  }
  $('#add').onclick = addPoint;
  ['val1', 'val2'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') addPoint(); }));

  $('#undo').onclick = () => { const arr = dir === 1 ? right : left; if (arr.length) { arr.pop(); save(); update(); } else toast('この側に点がありません'); };
  $('#reset').onclick = () => { if (confirm('全データを削除してセンターに戻る？')) { left = []; right = []; save(); update(); } };

  const all = () => [...[...left].reverse(), { x: 0, y: 0 }, ...right];

  function update() {
    const pts = all();
    $('#cnt').textContent = `${pts.length} pts`;
    $('#list').innerHTML = pts.map((p, i) => {
      const lab = p.x === 0 ? 'CENT' : p.x < 0 ? 'LEFT' : 'RGHT';
      return `<div class="${p.x === 0 ? 'cen' : ''}"><span>P${i} [${lab}]</span><span>X:${p.x.toFixed(3)} Y:${p.y.toFixed(3)}</span></div>`;
    }).join('');
    draw();
  }

  /* プレビュー：高解像度対応＋自動スケール */
  function draw() {
    const cv = $('#plot'), dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = cv.clientWidth, ch = cv.clientHeight;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, cw, ch);
    const pts = all(), padX = 28, padT = 34, padB = 22;
    const maxX = Math.max(5, ...pts.map(p => Math.abs(p.x)));
    const ys = pts.map(p => p.y).concat([0]), minY = Math.min(...ys), maxY = Math.max(...ys);
    const spanY = Math.max(2, maxY - minY);
    const sc = Math.min((cw / 2 - padX) / maxX, (ch - padT - padB) / spanY, 60);
    const cx = cw / 2, yOf = (y) => ch - padB - (y - minY) * sc;
    // DL線(標高0)
    g.strokeStyle = '#cbd5e1'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, yOf(0)); g.lineTo(cw, yOf(0)); g.stroke();
    g.fillStyle = '#94a3b8'; g.font = '10px sans-serif'; g.fillText('DL (±0)', 6, yOf(0) - 4);
    // センター線
    g.setLineDash([4, 4]); g.strokeStyle = '#f87171'; g.beginPath(); g.moveTo(cx, 0); g.lineTo(cx, ch); g.stroke(); g.setLineDash([]);
    // 地形線
    g.strokeStyle = '#334155'; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath();
    pts.forEach((p, i) => { const px = cx + p.x * sc, py = yOf(p.y); i ? g.lineTo(px, py) : g.moveTo(px, py); });
    g.stroke();
    pts.forEach(p => { g.fillStyle = p.x === 0 ? '#ef4444' : '#334155'; g.fillRect(cx + p.x * sc - 3, yOf(p.y) - 3, 6, 6); });
    g.fillStyle = '#64748b'; g.font = '10px sans-serif'; g.textAlign = 'right';
    g.fillText(`縮尺 1m = ${sc.toFixed(1)}px（自動）`, cw - 6, ch - 6);
  }
  addEventListener('resize', draw);

  /* DXF出力（出力内容は従来と同じ） */
  $('#dxf').onclick = async () => {
    const station = $('#station').value || 'No_0', pts = all();
    let dxf = '0\nSECTION\n2\nENTITIES\n';
    dxf += `0\nLINE\n8\nBGD\n10\n0\n20\n-2000\n11\n0\n21\n5000\n`;
    for (let i = 0; i < pts.length - 1; i++) dxf += `0\nLINE\n8\nBGD\n10\n${pts[i].x * 1000}\n20\n${pts[i].y * 1000}\n11\n${pts[i + 1].x * 1000}\n21\n${pts[i + 1].y * 1000}\n`;
    pts.forEach((p, i) => { dxf += `0\nTEXT\n8\nBGD\n10\n${p.x * 1000}\n20\n${p.y * 1000}\n40\n350\n1\nP${i}(${p.x.toFixed(3)},${p.y.toFixed(3)})\n7\nMS_GOTHIC\n`; });
    dxf += '0\nENDSEC\n0\nEOF';
    const blob = new Blob([dxf], { type: 'application/dxf' });
    const r = await shareBlob(blob, `${safeName(station)}.dxf`);
    if (r === 'download') toast('DXFをダウンロードしました');
  };

  update();
})();
</script>
</body>
</html>
